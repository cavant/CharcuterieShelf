name: Verify all i18n files are alphabetized

on:
  push:
    paths:
      - 'strings/**'
  pull_request:
    paths:
      - 'strings/**'

permissions:
  contents: read

jobs:
  update_translations:
    runs-on: ubuntu-latest
    steps:
    # Check out the repository
    - name: Checkout repository
      uses: actions/checkout@v4

    # Set up node to run the javascript
    - name: Set up node
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # The only argument is the `directory`, which is where the i18n files are stored.
    - name: Run Update JSON Files action
      uses: audiobookshelf/audiobookshelf-i18n-updater@v1.3.0
      with:
        directory: 'strings/'

    - name: Verify i18n files are sorted and committed cleanly
      run: |
        git diff --exit-code || (echo "Error: i18n translation files contain unsorted keys or formatting differences. Please run npm run test:i18n to verify." && exit 1)
