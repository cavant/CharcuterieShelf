name: 🚀 CharcuterieShelf Feature Request
description: Request a feature or enhancement for CharcuterieShelf
title: '[Enhancement]: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: '## Feature Request Description'
  - type: markdown
    attributes:
      value: 'Please check existing issues and discussions first. We welcome ideas for podcatcher tools, theming, widgets, and Android Auto!'
  - type: textarea
    id: describe
    attributes:
      label: Describe the Feature/Enhancement
      description: Please help us understand what you want.
      placeholder: What is your vision?
    validations:
      required: true
  - type: textarea
    id: the-why
    attributes:
      label: Why would this be helpful?
      description: Please help us understand why this would enhance your experience.
      placeholder: Explain the use case or audio listening workflow.
    validations:
      required: true
  - type: textarea
    id: image
    attributes:
      label: UI / UX Concept (Screenshot or mock)
      description: How could this look or where could it go?
      placeholder: If applicable, describe placement in player, settings, bookshelf, or drawer.
    validations:
      required: false
  - type: dropdown
    id: version
    attributes:
      label: Current App Version You Use
      multiple: false
      options:
        - '0.14.10-beta'
        - '0.14.9-beta'
        - '0.14.8-beta'
        - '0.14.7-beta'
        - '0.14.6-beta'
        - '0.14.5-beta'
        - '0.14.4-beta'
        - '0.14.3-beta'
        - 'Other'
    validations:
      required: true
