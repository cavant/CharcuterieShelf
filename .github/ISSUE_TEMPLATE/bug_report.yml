name: 🐞 CharcuterieShelf Bug Report
description: File a bug or issue to help us improve CharcuterieShelf.
title: '[Bug]: '
labels: ['bug', 'triage']
body:
  - type: markdown
    attributes:
      value: '## App Bug Description'
  - type: markdown
    attributes:
      value: 'Thank you for filing a bug report! 🐛 For tester support or questions, email **support@themagicsalami.net**.'
  - type: dropdown
    id: confirm-check
    attributes:
      label: I have verified that the bug is not already reported in open issues
      multiple: false
      options:
        - 'Yes'
        - 'No'
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What was the Problem?
      description: Please help us understand the problem.
      placeholder: Describe the problem you saw or experienced in detail! Include a screenshot or video, if applicable.
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce the Issue
      description: Please help us understand how we can reliably reproduce the issue.
      placeholder: '1. Go to Podcasts -> Favorites...'
    validations:
      required: true
  - type: textarea
    id: what-was-expected
    attributes:
      label: What was Expected?
      description: Please help us understand what should have happened.
      placeholder: Describe expected behavior.
    validations:
      required: true
  - type: markdown
    attributes:
      value: '## Mobile Environment'
  - type: input
    id: phone-model
    attributes:
      label: Phone Model
      description: What kind of phone or tablet are you using?
      placeholder: e.g. Pixel 8, Galaxy S24, Motorola Edge, etc
    validations:
      required: true
  - type: input
    id: phone-os
    attributes:
      label: Phone OS
      description: What operating system? If Android, what version (e.g. Android 14, 15)?
      placeholder: e.g. Android 14, Android 15, Android Auto
    validations:
      required: true
  - type: dropdown
    id: app-version
    attributes:
      label: CharcuterieShelf App Version
      description: Please check Settings -> Version in the app.
      multiple: false
      options:
        - '0.14.7-beta'
        - '0.14.6-beta'
        - '0.14.5-beta'
        - '0.14.4-beta'
        - '0.14.3-beta'
        - 'Other (specify in notes)'
    validations:
      required: true
  - type: dropdown
    id: install-source
    attributes:
      label: Installation Source
      multiple: false
      options:
        - 'Google Play Store (Closed Testing)'
        - 'GitHub Releases APK'
        - 'GitHub Pages Live Tester Portal'
        - 'Built from Source'
        - 'Other'
    validations:
      required: true
  - type: textarea
    id: additional-notes
    attributes:
      label: Additional Notes
      description: Anything else you want to add? (Server version, network setup, error logs)
      placeholder: 'e.g. Connected via LAN with local-first auto-switch.'
